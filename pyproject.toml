[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "garmin-training-mcp"
version = "0.1.0"
description = "Local read-only Garmin Personal API MCP server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "garmin-connect-personal-api-python==1.0.0",
  "mcp==1.30.0",
  "pydantic>=2.11,<3",
  "requests>=2.32,<3",
]

[project.scripts]
garmin-mcp = "garmin_training_mcp.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
